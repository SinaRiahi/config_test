name: Build Windows Executable

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x86_64 (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-app -> target

      - name: Run cargo check & test
        working-directory: rust-app
        run: |
          cargo check --target x86_64-pc-windows-msvc
          cargo test --target x86_64-pc-windows-msvc

      - name: Build release executable
        working-directory: rust-app
        run: |
          cargo build --release --target x86_64-pc-windows-msvc

      - name: Package portable release folder (exe + default config.json)
        shell: bash
        run: |
          mkdir -p dist-portable/cores
          cp rust-app/target/x86_64-pc-windows-msvc/release/vpn-config-checker.exe dist-portable/vpn-config-checker.exe
          cat << 'EOF' > dist-portable/config.json
          {
            "theme": "system",
            "xray_path": ".\\cores\\xray\\xray.exe",
            "singbox_path": ".\\cores\\sing-box\\sing-box.exe",
            "v2rayn_path": ".\\v2rayN.exe",
            "concurrency": 12,
            "timeout_secs": 15,
            "strict_region_only": true,
            "check_geo_ip": true,
            "check_ai_studio_web": true,
            "check_gemini_api": true,
            "custom_source_url": ""
          }
          EOF
          ls -lh dist-portable/

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpn-config-checker-windows-x64
          path: |
            dist-portable/vpn-config-checker.exe
            dist-portable/config.json
          if-no-files-found: error
          retention-days: 90

      - name: Create Release and Attach Binary (on Tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-portable/vpn-config-checker.exe
            dist-portable/config.json
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
